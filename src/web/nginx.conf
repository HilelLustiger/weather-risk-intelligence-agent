server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # /api/chat -> http://agent:8000/chat  (agent answers can take a while)
    location /api/ {
        # Resolve "agent" through Docker's DNS on each request (cached 10s), not once at
        # startup - otherwise recreating the agent container leaves nginx on a stale IP (502).
        resolver 127.0.0.11 valid=10s;
        set $agent http://agent:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $agent;
        proxy_read_timeout 120s;
    }
}
